[build-system]
requires = [
  "scikit-build-core>=0.12",
  "mkl-devel>=2026.0,<2027; sys_platform == 'linux' and platform_machine == 'x86_64'",
]
build-backend = "scikit_build_core.build"

[project]
name = "tommos"
version = "0.1.0"
description = "Matrix-free micromagnetic simulations with JAX"
readme = "README.md"
requires-python = ">=3.11"
authors = [
  { name = "MaMMoS-project" },
]
dependencies = [
  "jax",
  "mammos-entity",
  "matplotlib",
  "meshio",
  "meshpy",
  "mkl>=2026.0,<2027; sys_platform == \"linux\" and platform_machine == \"x86_64\"",
  "numpy",
  "pyamg",
  "scipy",
  "sparse-dot-mkl>=0.9.10; sys_platform == \"linux\" and platform_machine == \"x86_64\"",
]

[project.scripts]
tommos = "tommos.cli:main"

[tool.scikit-build]
minimum-version = "build-system.requires"
cmake.source-dir = "src/cpp"
wheel.packages = ["src/tommos"]
wheel.py-api = "py3"
sdist.include = ["src/cpp/CMakeLists.txt", "src/cpp/cpp_mkl_minimizer.cpp"]

[[tool.scikit-build.overrides]]
if.platform-system = "^darwin"
wheel.cmake = false
wheel.platlib = false

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64", "osx-arm64", "osx-64"]

[tool.pixi.pypi-dependencies]
tommos = { path = ".", editable = true }

[tool.pixi.tasks]
sample = { cmd = "cd samples && ./run_cube.sh" }
clean-samples = { cmd = "rm -rf samples/*.npz samples/bench_demag_curve samples/*.vtu samples/*.log" }

[tool.pixi.target.osx-arm64.tasks]
sample = { cmd = "cd samples && ./run_cube.sh --cpu-spmv-backend scipy --no-cpp-mkl" }

[tool.pixi.target.osx-64.tasks]
sample = { cmd = "cd samples && ./run_cube.sh --cpu-spmv-backend scipy --no-cpp-mkl" }

[tool.pixi.feature.test.pypi-dependencies]
pytest = "*"

[tool.pixi.feature.test.tasks]
test = { cmd = "JAX_ENABLE_X64=True pytest tests/" }

[tool.pixi.feature.lint.dependencies]
ruff = "*"
pre-commit = ">=4.6.0,<5"

[tool.pixi.feature.lint.tasks]
lint = { cmd = "pre-commit run --all-files" }

[tool.pixi.feature.build.pypi-dependencies]
build = "*"
cibuildwheel = "==4.1.1"

[tool.pixi.feature.build.tasks]
build-package = { cmd = "python -m build" }

[tool.pixi.feature.sample.dependencies]
gmsh = ">=4.12.2,<5"

[tool.pixi.feature.sample.target.unix.dependencies]
neper = "*"

[tool.pixi.feature.sample.pypi-dependencies]
jaxopt = "*"
mammos-analysis = "*"

[tool.pixi.feature.cuda]
platforms = ["linux-64"]

[tool.pixi.feature.cuda.pypi-dependencies]
jax = { version = "*", extras = ["cuda12"] }

[tool.pixi.feature.cuda.tasks]
sample-gpu = { cmd = "cd samples && ./run_cube.sh" }

[tool.pixi.environments]
default = { solve-group = "tommos" }
cpu = { solve-group = "tommos" }
test = { features = ["sample", "test"], solve-group = "tommos" }
lint = { features = ["lint"], solve-group = "tommos" }
build = { features = ["build"], solve-group = "tommos" }
sample = { features = ["sample"], solve-group = "tommos" }
cuda = { features = ["cuda", "sample"], solve-group = "tommos" }

[tool.ruff]
target-version = "py311"
exclude = [
  "dev",
]
line-length = 120
[tool.ruff.lint]
select = [
  "B",   # flake8-bugbear
  "D",   # pydocstyle
  "E",   # pycodestyle
  "F",   # Pyflakes
  "I",   # isort
  "SIM", # flake8-simplify
  "UP",  # pyupgrade
]
isort.known-local-folder = [ "tommos" ]
pydocstyle.convention = "google"

[tool.ruff.lint.per-file-ignores]
"*.ipynb" = ["B018"]  # "Found useless expression. Either assign it to a variable or remove it."; false positives when using implicit __repr__ in the notebook
"tests/*" = ["D100", "D103"]  # do not enforce docstrings in tests
